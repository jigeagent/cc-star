[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-star"
version = "0.2.1"
description = "Upgrade Claude Code native memory to a self-evolving digital brain — SQLite+FTS5 hot storage, L1→L2→L3 cognitive pipeline (policy induction, skill crystallization, world model), optional OpenViking cold sync, and built-in viewer"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28",
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/jigeagent/cc-star"

[project.scripts]
cc-star = "cc_star.cli:main"

[tool.hatch.build]
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
